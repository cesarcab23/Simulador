<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Simulador de Inspección Comercial · San Isidro</title>
<link rel="icon" href="assets/escudo.png">
<style>
:root{--brand:#1F4D37;--on:#fff;--paper:#f2f5f2;--sheet:#fff;--ink:#1b2622;--muted:#5b6a64;--line:#d9e0dc;--red:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#121816;--sheet:#1a2220;--ink:#e4ebe7;--muted:#9aaaa3;--line:#2c3834;--red:#f07b72;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
.band{background:var(--brand);color:var(--on);padding:28px 16px 70px;text-align:center}
.band img{width:76px;height:76px}
.band h1{font:700 26px/1.1 "Arial Narrow",system-ui,sans-serif;margin:12px 0 4px;letter-spacing:.01em}
.band p{margin:0;opacity:.8;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:8px;max-width:380px;width:calc(100% - 32px);margin:-46px auto 0;padding:22px}
label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input[type=password]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink)}
.rem{display:flex;gap:8px;align-items:center;margin:12px 0 16px;font-size:14px;color:var(--muted)}
.rem input{accent-color:var(--brand)}
button{width:100%;font:inherit;font-weight:600;padding:10px;border:0;border-radius:5px;background:var(--brand);color:var(--on);cursor:pointer}
button:disabled{opacity:.6;cursor:default}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.msg{min-height:1.4em;margin:10px 0 0;font-size:14px;color:var(--red)}
.foot{text-align:center;color:var(--muted);font-size:12.5px;padding:20px 16px}
</style>
</head>
<body>
<div class="band">
  <img src="assets/escudo.png" alt="Escudo de San Isidro" width="76" height="76">
  <h1>Simulador de Inspección Comercial</h1>
  <p>Acceso restringido</p>
</div>
<form class="card" id="f" autocomplete="off">
  <label for="pw">Contraseña</label>
  <input id="pw" type="password" autocomplete="current-password" required autofocus>
  <div class="rem"><input type="checkbox" id="rem"><label for="rem" style="margin:0;text-transform:none;letter-spacing:0;font-size:14px">Recordar en este dispositivo</label></div>
  <button id="go" type="submit">Ingresar</button>
  <p class="msg" id="msg" role="alert"></p>
</form>
<p class="foot">Pedile la contraseña al equipo de Habilitaciones.</p>

const KEY = "sim-inspeccion-clave";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function derivar(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", salt:b64(P.salt), iterations:P.iter, hash:"SHA-256"}, base, 256));
}
async function abrir(raw){
  const k = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.iv)}, k, b64(P.ct));
  return new TextDecoder().decode(pt);
}
function mostrar(html){ document.open(); document.write(html); document.close(); }
const enB64 = u => btoa(String.fromCharCode(...u));
(async () => {
  if(!window.crypto || !crypto.subtle){ document.getElementById("msg").textContent = "Este navegador no permite abrir el simulador. Probá con Chrome, Edge, Firefox o Safari actualizados."; return; }
  try{
    const g = JSON.parse(localStorage.getItem(KEY) || "null");
    if(g && g.salt === P.salt){ mostrar(await abrir(b64(g.k))); return; }
  }catch(e){ try{ localStorage.removeItem(KEY); }catch(_){} }
})();
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), msg = document.getElementById("msg");
  btn.disabled = true; btn.textContent = "Verificando…"; msg.textContent = "";
  try{
    const raw = await derivar(document.getElementById("pw").value);
    const html = await abrir(raw);
    if(document.getElementById("rem").checked){ try{ localStorage.setItem(KEY, JSON.stringify({salt:P.salt, k:enB64(raw)})); }catch(_){} }
    mostrar(html);
  }catch(err){
    msg.textContent = "Contraseña incorrecta.";
    btn.disabled = false; btn.textContent = "Ingresar";
    document.getElementById("pw").select();
  }
});
})();
</script>
